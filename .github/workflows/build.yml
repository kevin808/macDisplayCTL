name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build Universal app
        run: |
          set -o pipefail
          if ! ./build-app.sh 2>&1 | tee build-output.txt; then
            python3 - <<'PYLOG'
          from pathlib import Path
          message = Path('build-output.txt').read_text()[-12000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Compiler output::{message}')
          PYLOG
            exit 1
          fi
        env:
          ARCHS: arm64 x86_64
      - name: Test
        run: ./test.sh
      - name: Verify architectures and package
        run: |
          for binary in build/macDisplayCtl.app/Contents/MacOS/macDisplayCtl build/macDisplayCtl.app/Contents/Resources/macDisplayCtl; do
            archs="$(lipo -archs "$binary")"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          done
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macDisplayCtl.app dist/macDisplayCtl-universal.zip
          cd dist
          shasum -a 256 macDisplayCtl-universal.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macDisplayCtl-universal
          path: dist/*
          retention-days: 30

  development-release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macDisplayCtl-universal
          path: dist
      - name: Publish development build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<EOF_NOTES
          Universal macOS app for Apple Silicon and Intel. Requires macOS 13 or later.

          This is an unsigned development build from main. Versioned releases are signed and notarized when the Apple signing secrets are configured.
          Source commit: $BUILD_SHA
          EOF_NOTES
          if gh release view continuous > /dev/null 2>&1; then
            gh release upload continuous dist/* --clobber
            gh api "repos/$GH_REPO/git/refs/tags/continuous" -X PATCH -f sha="$BUILD_SHA" -F force=true
            gh release edit continuous --notes-file notes.md
          else
            gh release create continuous dist/* --target "$BUILD_SHA" --title "Latest development build" --prerelease --notes-file notes.md
          fi

  signed-release:
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'v'))
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.APPLE_BUILD_KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          export KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          test -n "$SIGNING_IDENTITY"
          test -n "$TEAM_ID"
          test -n "$APPLE_ID"
          test -n "$APP_SPECIFIC_PASSWORD"
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > developer-id.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import developer-id.p12 -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Build Universal app
        run: ARCHS="arm64 x86_64" ./build-app.sh
      - name: Test
        run: ./test.sh
      - name: Sign app and helper
        run: |
          set -euo pipefail
          app=build/macDisplayCtl.app
          codesign --force --timestamp --options runtime --sign "$SIGNING_IDENTITY" "$app/Contents/Resources/macDisplayCtl"
          codesign --force --timestamp --options runtime --sign "$SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for binary in "$app/Contents/MacOS/macDisplayCtl" "$app/Contents/Resources/macDisplayCtl"; do
            archs="$(lipo -archs "$binary")"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          done
      - name: Store Apple notarization credentials
        run: |
          xcrun notarytool store-credentials macDisplayCtl-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"
      - name: Submit for notarization
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macDisplayCtl.app dist/macDisplayCtl-signed.zip
          xcrun notarytool submit dist/macDisplayCtl-signed.zip \
            --keychain-profile macDisplayCtl-notary \
            --keychain "$KEYCHAIN_PATH" \
            --wait
      - name: Staple and validate notarization
        run: |
          set -euo pipefail
          xcrun stapler staple build/macDisplayCtl.app
          xcrun stapler validate build/macDisplayCtl.app
          codesign --verify --deep --strict --verbose=2 build/macDisplayCtl.app
          spctl --assess --type execute --verbose=2 build/macDisplayCtl.app
          rm -f dist/macDisplayCtl-signed.zip
          ditto -c -k --sequesterRsrc --keepParent build/macDisplayCtl.app dist/macDisplayCtl-${{ github.ref_name }}-universal-notarized.zip
          shasum -a 256 dist/*.zip > dist/SHA256SUMS.txt
      - name: Publish notarized release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<EOF_NOTES
          Developer ID signed and Apple notarized Universal macOS app for Apple Silicon and Intel. Requires macOS 13 or later.

          The app includes the background recovery monitor and requires no Python or developer tools at runtime.
          Source commit: $BUILD_SHA
          EOF_NOTES
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file notes.md
      - name: Remove temporary key material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f developer-id.p12
